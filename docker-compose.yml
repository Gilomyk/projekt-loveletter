networks:
  internal:
    internal: true
  external:
    driver: bridge

services:
  redis:
    image: redis:latest
    networks:
      - internal
    ports:
      - "6379:6379"
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: loveletter_db
      POSTGRES_USER: loveletter_user
      POSTGRES_PASSWORD: bezpieczne_haslo
    networks:
    - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "sleep 3 && python manage.py makemigrations --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DJANGO_SETTINGS_MODULE=loveletter.settings
      - PYTHONUNBUFFERED=1
    networks:
      - internal
      - external

  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    command: yarn dev
    volumes:
      - ./frontend-app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - internal
      - external


volumes:
  postgres_data:
